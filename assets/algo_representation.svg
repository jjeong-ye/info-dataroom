<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <defs>
    <marker id="ah3" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4b5563"/>
    </marker>
    <style>
      .col{font-size:14px;font-weight:700;fill:#3b6ef5;text-anchor:middle;}
      .body{font-size:12px;fill:#1f2637;}
      .mono{font-size:12px;fill:#1f2637;font-family:'Consolas','D2Coding',monospace;}
      .t{font-size:11.5px;fill:#1f2637;text-anchor:middle;dominant-baseline:middle;}
      .ln{stroke:#4b5563;stroke-width:1.4;fill:none;}
      .sub{font-size:10.5px;fill:#6b7280;text-anchor:middle;}
      .yn{font-size:10.5px;fill:#6b7280;}
    </style>
  </defs>
  <text x="360" y="20" font-size="13" fill="#6b7280" text-anchor="middle">같은 알고리즘 — "수를 입력받아 짝수 / 홀수 판별하기"</text>

  <!-- 세로 구분선 -->
  <line x1="240" y1="44" x2="240" y2="320" stroke="#eef0f5"/>
  <line x1="482" y1="44" x2="482" y2="320" stroke="#eef0f5"/>

  <!-- ===== 자연어 ===== -->
  <text x="120" y="54" class="col">자연어</text>
  <text x="26" y="92"  class="body">① 수를 입력받는다.</text>
  <text x="26" y="128" class="body">② 2로 나눈 나머지를</text>
  <text x="40" y="146" class="body">   구한다.</text>
  <text x="26" y="182" class="body">③ 나머지가 0이면</text>
  <text x="40" y="200" class="body">   "짝수"를 출력한다.</text>
  <text x="26" y="236" class="body">④ 아니면 "홀수"를</text>
  <text x="40" y="254" class="body">   출력한다.</text>
  <text x="120" y="304" class="sub">쉽게 읽힘 · 뜻이 모호할 수 있음</text>

  <!-- ===== 순서도 ===== -->
  <text x="360" y="54" class="col">순서도</text>
  <!-- 시작 -->
  <rect x="320" y="72" width="80" height="26" rx="13" fill="#e6f7f5" stroke="#0ea5a4" stroke-width="1.5"/>
  <text x="360" y="85" class="t">시작</text>
  <line class="ln" x1="360" y1="98" x2="360" y2="114" marker-end="url(#ah3)"/>
  <!-- 입력 -->
  <polygon points="326,116 414,116 394,142 306,142" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="360" y="130" class="t">수 입력</text>
  <line class="ln" x1="360" y1="142" x2="360" y2="160" marker-end="url(#ah3)"/>
  <!-- 판단 -->
  <polygon points="360,164 418,190 360,216 302,190" fill="#fff4e6" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="190" class="t">나머지=0?</text>
  <!-- 분기: 거짓(왼쪽) -->
  <path class="ln" d="M302,190 H286 V246" marker-end="url(#ah3)"/>
  <text x="266" y="184" class="yn">거짓</text>
  <!-- 분기: 참(오른쪽) -->
  <path class="ln" d="M418,190 H434 V246" marker-end="url(#ah3)"/>
  <text x="440" y="184" class="yn">참</text>
  <!-- 결과 박스 -->
  <rect x="248" y="248" width="76" height="28" rx="6" fill="#eef2ff" stroke="#3b6ef5" stroke-width="1.5"/>
  <text x="286" y="262" class="t">"홀수" 출력</text>
  <rect x="396" y="248" width="76" height="28" rx="6" fill="#eef2ff" stroke="#3b6ef5" stroke-width="1.5"/>
  <text x="434" y="262" class="t">"짝수" 출력</text>
  <text x="360" y="304" class="sub">흐름을 한눈에 · 약속된 기호 필요</text>

  <!-- ===== 의사 코드 ===== -->
  <text x="600" y="54" class="col">의사 코드</text>
  <text x="500" y="92"  class="mono">입력 n</text>
  <text x="500" y="118" class="mono">r ← n mod 2</text>
  <text x="500" y="144" class="mono">if r = 0 then</text>
  <text x="522" y="170" class="mono">출력 "짝수"</text>
  <text x="500" y="196" class="mono">else</text>
  <text x="522" y="222" class="mono">출력 "홀수"</text>
  <text x="600" y="304" class="sub">코드와 가까움 · 형식을 알아야 함</text>
</svg>
