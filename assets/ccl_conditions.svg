<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <defs>
    <style>
      .head{font-size:15px;font-weight:700;fill:#1f2637;text-anchor:middle;}
      .code{font-size:13px;font-weight:800;text-anchor:middle;}
      .nm{font-size:13px;font-weight:700;fill:#1f2637;text-anchor:middle;}
      .ex{font-size:10.5px;fill:#6b7280;text-anchor:middle;}
      .foot{font-size:11.5px;fill:#374151;text-anchor:middle;}
      .g{fill:#1f2637;}
      .gl{fill:none;stroke:#1f2637;stroke-width:3.4;stroke-linecap:round;}
    </style>
  </defs>
  <text x="360" y="26" class="head">CCL — 저작물 이용 허락 4가지 조건</text>

  <!-- BY 저작자 표시: 사람 -->
  <circle cx="110" cy="86" r="34" fill="#eef2ff" stroke="#3b6ef5" stroke-width="1.8"/>
  <circle cx="110" cy="72" r="7" class="g"/>
  <path class="g" d="M101,104 L101,91 Q101,81 110,81 Q119,81 119,91 L119,104 Z"/>
  <text x="110" y="142" class="code" fill="#3b6ef5">BY</text>
  <text x="110" y="161" class="nm">저작자 표시</text>
  <text x="110" y="179" class="ex">이름·출처 밝히기(필수)</text>

  <!-- NC 비영리: $에 빗금 -->
  <circle cx="300" cy="86" r="34" fill="#e6f7f5" stroke="#0ea5a4" stroke-width="1.8"/>
  <text x="300" y="98" text-anchor="middle" font-size="30" font-weight="800" class="g">$</text>
  <line class="gl" x1="282" y1="104" x2="318" y2="68"/>
  <text x="300" y="142" class="code" fill="#0ea5a4">NC</text>
  <text x="300" y="161" class="nm">비영리</text>
  <text x="300" y="179" class="ex">영리 목적 사용 금지</text>

  <!-- ND 변경 금지: = -->
  <circle cx="490" cy="86" r="34" fill="#fff4e6" stroke="#f59e0b" stroke-width="1.8"/>
  <line class="gl" x1="475" y1="80" x2="505" y2="80" stroke-width="4"/>
  <line class="gl" x1="475" y1="92" x2="505" y2="92" stroke-width="4"/>
  <text x="490" y="142" class="code" fill="#b45309">ND</text>
  <text x="490" y="161" class="nm">변경 금지</text>
  <text x="490" y="179" class="ex">2차적 저작물 작성 금지</text>

  <!-- SA 동일조건 변경 허락: 순환 화살표 -->
  <circle cx="640" cy="86" r="34" fill="#f3ecff" stroke="#8b5cf6" stroke-width="1.8"/>
  <path class="gl" d="M640,73 A13,13 0 1 1 628,80" stroke-width="3"/>
  <path class="g" d="M640,68 L646,75 L636,75 Z"/>
  <text x="640" y="142" class="code" fill="#7c3aed">SA</text>
  <text x="640" y="161" class="nm">동일조건 변경 허락</text>
  <text x="640" y="179" class="ex">같은 라이선스로 공유</text>

  <text x="360" y="212" class="foot">BY는 모든 조합에 필수 · 조건을 묶어 6가지 라이선스(BY, BY-NC, BY-ND, BY-SA, BY-NC-SA, BY-NC-ND)</text>
</svg>
