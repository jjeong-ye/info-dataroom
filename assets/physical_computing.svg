<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4b5563"/>
    </marker>
    <style>
      .t{font-size:14px;fill:#1f2637;text-anchor:middle;dominant-baseline:middle;font-weight:700;}
      .ex{font-size:11px;fill:#6b7280;text-anchor:middle;}
      .step{font-size:12px;fill:#0ea5a4;text-anchor:middle;font-weight:700;}
      .head{font-size:15px;font-weight:700;fill:#1f2637;text-anchor:middle;}
      .ln{stroke:#4b5563;stroke-width:1.8;fill:none;}
      .sens{fill:#e6f7f5;stroke:#0ea5a4;stroke-width:1.6;}
      .mcu{fill:#fff4e6;stroke:#f59e0b;stroke-width:1.6;}
      .act{fill:#eef2ff;stroke:#3b6ef5;stroke-width:1.6;}
    </style>
  </defs>
  <text x="360" y="26" class="head">피지컬 컴퓨팅의 동작 — 감지 → 처리 → 동작</text>

  <text x="120" y="70" class="step">① 감지(입력)</text>
  <rect class="sens" x="40" y="82" width="160" height="60" rx="12"/>
  <text x="120" y="104" class="t">센서</text>
  <text x="120" y="124" class="ex">빛·소리·온도·움직임</text>
  <line class="ln" x1="200" y1="112" x2="258" y2="112" marker-end="url(#ah)"/>

  <text x="360" y="70" class="step">② 판단·처리</text>
  <rect class="mcu" x="262" y="82" width="196" height="60" rx="12"/>
  <text x="360" y="104" class="t">마이크로컨트롤러</text>
  <text x="360" y="124" class="ex">마이크로비트·아두이노 (프로그램)</text>
  <line class="ln" x1="458" y1="112" x2="516" y2="112" marker-end="url(#ah)"/>

  <text x="600" y="70" class="step">③ 동작(출력)</text>
  <rect class="act" x="520" y="82" width="160" height="60" rx="12"/>
  <text x="600" y="104" class="t">액추에이터</text>
  <text x="600" y="124" class="ex">LED·모터·스피커</text>

  <text x="360" y="182" class="ex">예) 어두워지면(빛 센서) → '어두우면' 판단 → LED 켜기</text>
</svg>
