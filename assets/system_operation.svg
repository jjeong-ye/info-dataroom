<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4b5563"/>
    </marker>
    <style>
      .head{font-size:15px;font-weight:700;fill:#1f2637;text-anchor:middle;}
      .t{font-size:13px;fill:#1f2637;text-anchor:middle;dominant-baseline:middle;font-weight:700;}
      .ex{font-size:10.5px;fill:#6b7280;text-anchor:middle;}
      .ln{stroke:#4b5563;stroke-width:1.8;fill:none;}
      .b{fill:#eef2ff;stroke:#3b6ef5;stroke-width:1.5;}
      .boot{fill:#fff4e6;stroke:#f59e0b;stroke-width:1.5;}
      .save{fill:#e6f7f5;stroke:#0ea5a4;stroke-width:1.5;}
    </style>
  </defs>
  <text x="360" y="26" class="head">컴퓨팅 시스템의 동작 원리</text>

  <rect class="boot" x="24" y="70" width="120" height="52" rx="10"/>
  <text x="84" y="90" class="t">전원 ON</text><text x="84" y="108" class="ex">부팅 → 운영체제 실행</text>
  <line class="ln" x1="144" y1="96" x2="170" y2="96" marker-end="url(#ah)"/>

  <rect class="b" x="172" y="70" width="120" height="52" rx="10"/>
  <text x="232" y="90" class="t">응용 SW 실행</text><text x="232" y="108" class="ex">앱 시작</text>
  <line class="ln" x1="292" y1="96" x2="318" y2="96" marker-end="url(#ah)"/>

  <rect class="b" x="320" y="70" width="120" height="52" rx="10"/>
  <text x="380" y="90" class="t">입력 → 처리</text><text x="380" y="108" class="ex">CPU가 계산</text>
  <line class="ln" x1="440" y1="96" x2="466" y2="96" marker-end="url(#ah)"/>

  <rect class="b" x="468" y="70" width="110" height="52" rx="10"/>
  <text x="523" y="90" class="t">출력</text><text x="523" y="108" class="ex">결과 표시</text>
  <line class="ln" x1="578" y1="96" x2="604" y2="96" marker-end="url(#ah)"/>

  <rect class="save" x="606" y="70" width="90" height="52" rx="10"/>
  <text x="651" y="90" class="t">저장</text><text x="651" y="108" class="ex">기억장치</text>

  <text x="360" y="168" class="ex">전원을 켜면 운영체제가 먼저 준비되고, 그 위에서 입력·처리·출력·저장이 이루어진다</text>
</svg>
