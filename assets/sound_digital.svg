<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4b5563"/>
    </marker>
    <style>
      .head{font-size:15px;font-weight:700;fill:#1f2637;text-anchor:middle;}
      .step{font-size:13px;font-weight:700;fill:#0ea5a4;text-anchor:middle;}
      .ex{font-size:11px;fill:#6b7280;text-anchor:middle;}
      .ax{stroke:#9aa3b2;stroke-width:1.1;}
      .wave{stroke:#0ea5a4;stroke-width:2.2;fill:none;}
      .bar{fill:#dbe4ff;stroke:#3b6ef5;stroke-width:1.3;}
      .dot{fill:#f59e0b;}
      .ln{stroke:#4b5563;stroke-width:1.6;fill:none;}
      .bin{font-size:12px;fill:#3b6ef5;text-anchor:middle;font-weight:700;}
    </style>
  </defs>
  <text x="360" y="24" class="head">소리의 디지털 변환 — 표본화 → 양자화 → 부호화</text>

  <!-- 표본화 -->
  <text x="130" y="52" class="step">① 표본화</text>
  <line class="ax" x1="50" y1="70" x2="50" y2="160"/>
  <line class="ax" x1="50" y1="160" x2="210" y2="160"/>
  <path class="wave" d="M50,120 C80,70 100,150 130,110 C160,75 185,140 210,115"/>
  <circle class="dot" cx="70" cy="103" r="3.5"/>
  <circle class="dot" cx="110" cy="118" r="3.5"/>
  <circle class="dot" cx="150" cy="97" r="3.5"/>
  <circle class="dot" cx="190" cy="122" r="3.5"/>
  <text x="130" y="182" class="ex">일정 간격으로 값 뽑기</text>

  <line class="ln" x1="222" y1="115" x2="248" y2="115" marker-end="url(#ah)"/>

  <!-- 양자화 -->
  <text x="360" y="52" class="step">② 양자화</text>
  <line class="ax" x1="280" y1="70" x2="280" y2="160"/>
  <line class="ax" x1="280" y1="160" x2="440" y2="160"/>
  <rect class="bar" x="296" y="110" width="22" height="50"/>
  <rect class="bar" x="330" y="124" width="22" height="36"/>
  <rect class="bar" x="364" y="98" width="22" height="62"/>
  <rect class="bar" x="398" y="128" width="22" height="32"/>
  <text x="360" y="182" class="ex">정해진 수치로 반올림</text>

  <line class="ln" x1="452" y1="115" x2="478" y2="115" marker-end="url(#ah)"/>

  <!-- 부호화 -->
  <text x="590" y="52" class="step">③ 부호화</text>
  <rect x="500" y="90" width="180" height="70" rx="10" fill="#eef2ff" stroke="#3b6ef5" stroke-width="1.4"/>
  <text x="590" y="118" class="bin">011  001  110  010</text>
  <text x="590" y="140" class="ex">수치를 0·1로 변환</text>
  <text x="590" y="182" class="ex">→ 디지털 소리(mp3 등)</text>

  <text x="360" y="224" class="ex">표본화 간격이 촘촘·양자화가 세밀할수록 원음에 가깝고 용량은 커짐</text>
</svg>
