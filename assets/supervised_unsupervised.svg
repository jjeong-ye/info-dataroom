<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <defs>
    <style>
      .head{font-size:15px;font-weight:700;fill:#1f2637;text-anchor:middle;}
      .sub{font-size:13px;font-weight:700;text-anchor:middle;}
      .ex{font-size:11px;fill:#6b7280;text-anchor:middle;}
      .box{fill:#fff;stroke:#e2e6ee;stroke-width:1.4;}
      .ax{stroke:#9aa3b2;stroke-width:1.1;}
    </style>
  </defs>
  <text x="360" y="26" class="head">지도학습 vs 비지도학습</text>

  <!-- 지도학습 박스 -->
  <rect class="box" x="24" y="44" width="330" height="180" rx="12" stroke="#0ea5a4"/>
  <text x="189" y="66" class="sub" fill="#0ea5a4">지도학습 — 정답(레이블) 있음</text>

  <!-- 분류 -->
  <text x="105" y="92" class="ex">분류(범주 나누기)</text>
  <circle cx="70" cy="120" r="7" fill="#3b6ef5"/><circle cx="88" cy="132" r="7" fill="#3b6ef5"/><circle cx="76" cy="146" r="7" fill="#3b6ef5"/>
  <rect x="120" y="112" width="13" height="13" fill="#f59e0b"/><rect x="138" y="126" width="13" height="13" fill="#f59e0b"/><rect x="126" y="140" width="13" height="13" fill="#f59e0b"/>
  <line x1="105" y1="105" x2="105" y2="160" stroke="#0ea5a4" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="105" y="178" class="ex">개 / 고양이</text>

  <!-- 회귀 -->
  <text x="270" y="92" class="ex">회귀(수치 예측)</text>
  <line class="ax" x1="230" y1="160" x2="230" y2="105"/><line class="ax" x1="230" y1="160" x2="320" y2="160"/>
  <g fill="#8b5cf6"><circle cx="244" cy="150" r="3"/><circle cx="260" cy="142" r="3"/><circle cx="276" cy="132" r="3"/><circle cx="292" cy="124" r="3"/><circle cx="308" cy="114" r="3"/></g>
  <line x1="238" y1="154" x2="314" y2="110" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="275" y="178" class="ex">기온·가격 예측</text>

  <!-- 비지도학습 박스 -->
  <rect class="box" x="366" y="44" width="330" height="180" rx="12" stroke="#f59e0b"/>
  <text x="531" y="66" class="sub" fill="#b45309">비지도학습 — 정답 없음</text>
  <text x="531" y="92" class="ex">군집(비슷한 것끼리 묶기)</text>

  <!-- 3 clusters -->
  <g fill="#0ea5a4"><circle cx="440" cy="120" r="7"/><circle cx="456" cy="130" r="7"/><circle cx="444" cy="142" r="7"/></g>
  <ellipse cx="447" cy="131" rx="30" ry="26" fill="none" stroke="#0ea5a4" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g fill="#3b6ef5"><circle cx="530" cy="115" r="7"/><circle cx="546" cy="128" r="7"/><circle cx="532" cy="140" r="7"/></g>
  <ellipse cx="536" cy="128" rx="30" ry="26" fill="none" stroke="#3b6ef5" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g fill="#f59e0b"><circle cx="620" cy="122" r="7"/><circle cx="636" cy="134" r="7"/><circle cx="624" cy="146" r="7"/></g>
  <ellipse cx="626" cy="134" rx="30" ry="26" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="531" y="188" class="ex">정답 없이 특징으로 그룹화 (고객 그룹화 등)</text>
</svg>
