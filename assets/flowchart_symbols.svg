<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4b5563"/>
    </marker>
    <style>
      .t{font-size:13px;fill:#1f2637;text-anchor:middle;dominant-baseline:middle;}
      .cap{font-size:12px;fill:#6b7280;text-anchor:middle;}
      .use{font-size:11px;fill:#9aa1ad;text-anchor:middle;}
    </style>
  </defs>

  <!-- 시작/끝 (터미널) -->
  <rect x="30" y="30" width="120" height="46" rx="23" fill="#e6f7f5" stroke="#0ea5a4" stroke-width="1.6"/>
  <text x="90" y="53" class="t">시작 / 끝</text>
  <text x="90" y="96" class="cap">터미널(둥근 사각형)</text>
  <text x="90" y="114" class="use">알고리즘의 시작과 끝</text>

  <!-- 처리 -->
  <rect x="190" y="30" width="120" height="46" rx="6" fill="#eef2ff" stroke="#3b6ef5" stroke-width="1.6"/>
  <text x="250" y="53" class="t">처리</text>
  <text x="250" y="96" class="cap">직사각형</text>
  <text x="250" y="114" class="use">계산·명령 실행</text>

  <!-- 판단 -->
  <polygon points="410,30 470,53 410,76 350,53" fill="#fff4e6" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="410" y="53" class="t">판단</text>
  <text x="410" y="96" class="cap">마름모</text>
  <text x="410" y="114" class="use">조건 검사(참/거짓)</text>

  <!-- 입출력 -->
  <polygon points="520,30 630,30 610,76 500,76" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="565" y="53" class="t">입력 / 출력</text>
  <text x="565" y="96" class="cap">평행사변형</text>
  <text x="565" y="114" class="use">자료 입력·결과 출력</text>

  <!-- 흐름선 -->
  <line x1="150" y1="150" x2="230" y2="150" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah2)"/>
  <text x="360" y="154" class="cap">흐름선(화살표) — 처리 순서와 방향을 나타냄</text>
</svg>
