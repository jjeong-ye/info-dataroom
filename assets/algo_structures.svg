<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4b5563"/>
    </marker>
    <style>
      .t{font-size:13px;fill:#1f2637;text-anchor:middle;dominant-baseline:middle;}
      .lbl{font-size:11px;fill:#6b7280;text-anchor:middle;}
      .head{font-size:15px;font-weight:700;fill:#1f2637;text-anchor:middle;}
      .yn{font-size:10px;fill:#6b7280;text-anchor:middle;}
      .ln{stroke:#4b5563;stroke-width:1.5;fill:none;}
      .box{fill:#eef2ff;stroke:#3b6ef5;stroke-width:1.6;}
      .cond{fill:#fff4e6;stroke:#f59e0b;stroke-width:1.6;}
      .term{fill:#e6f7f5;stroke:#0ea5a4;stroke-width:1.6;}
    </style>
  </defs>

  <!-- 세로 구분선 -->
  <line x1="235" y1="14" x2="235" y2="236" stroke="#eef0f5"/>
  <line x1="485" y1="14" x2="485" y2="236" stroke="#eef0f5"/>

  <!-- ===== 순차 ===== -->
  <text x="110" y="26" class="head">순차 구조</text>
  <rect class="box" x="60" y="44" width="100" height="32" rx="8"/><text x="110" y="60" class="t">명령 1</text>
  <line class="ln" x1="110" y1="76" x2="110" y2="96" marker-end="url(#ah)"/>
  <rect class="box" x="60" y="98" width="100" height="32" rx="8"/><text x="110" y="114" class="t">명령 2</text>
  <line class="ln" x1="110" y1="130" x2="110" y2="150" marker-end="url(#ah)"/>
  <rect class="box" x="60" y="152" width="100" height="32" rx="8"/><text x="110" y="168" class="t">명령 3</text>
  <text x="110" y="212" class="lbl">위에서 아래로 차례대로</text>

  <!-- ===== 선택 ===== -->
  <text x="360" y="26" class="head">선택 구조</text>
  <polygon class="cond" points="360,44 405,82 360,120 315,82"/>
  <text x="360" y="82" class="t">조건?</text>
  <line class="ln" x1="315" y1="82" x2="300" y2="82"/>
  <line class="ln" x1="300" y1="82" x2="300" y2="140" marker-end="url(#ah)"/>
  <text x="292" y="76" class="yn">거짓</text>
  <line class="ln" x1="405" y1="82" x2="420" y2="82"/>
  <line class="ln" x1="420" y1="82" x2="420" y2="140" marker-end="url(#ah)"/>
  <text x="428" y="76" class="yn">참</text>
  <rect class="box" x="255" y="142" width="90" height="32" rx="8"/><text x="300" y="158" class="t">명령 B</text>
  <rect class="box" x="375" y="142" width="90" height="32" rx="8"/><text x="420" y="158" class="t">명령 A</text>
  <text x="360" y="212" class="lbl">조건에 따라 갈라짐</text>

  <!-- ===== 반복 ===== -->
  <text x="600" y="26" class="head">반복 구조</text>
  <polygon class="cond" points="600,44 646,78 600,112 554,78"/>
  <text x="600" y="78" class="t">조건?</text>
  <!-- 참 -> 반복 명령 -->
  <line class="ln" x1="600" y1="112" x2="600" y2="134" marker-end="url(#ah)"/>
  <text x="614" y="126" class="yn">참</text>
  <rect class="box" x="548" y="136" width="104" height="32" rx="8"/><text x="600" y="152" class="t">반복할 명령</text>
  <!-- 되돌아가는 화살표(왼쪽) -->
  <path class="ln" d="M548,152 H520 V78 H554" marker-end="url(#ah)"/>
  <!-- 거짓 -> 종료(오른쪽) -->
  <path class="ln" d="M646,78 H676 V128" marker-end="url(#ah)"/>
  <text x="662" y="70" class="yn">거짓</text>
  <text x="676" y="142" class="lbl">종료</text>
  <text x="600" y="212" class="lbl">조건이 참인 동안 되풀이</text>
</svg>
