<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4b5563"/>
    </marker>
    <style>
      .head{font-size:15px;font-weight:700;fill:#1f2637;text-anchor:middle;}
      .t{font-size:12.5px;fill:#1f2637;text-anchor:middle;dominant-baseline:middle;font-weight:700;}
      .n{font-size:11px;fill:#3b6ef5;text-anchor:middle;font-weight:700;}
      .ex{font-size:11px;fill:#6b7280;text-anchor:middle;}
      .ln{stroke:#4b5563;stroke-width:1.8;fill:none;}
      .b1{fill:#e6f7f5;stroke:#0ea5a4;stroke-width:1.6;}
      .b2{fill:#eef2ff;stroke:#3b6ef5;stroke-width:1.6;}
      .b3{fill:#fff4e6;stroke:#f59e0b;stroke-width:1.6;}
    </style>
  </defs>
  <text x="360" y="26" class="head">인공지능 시스템 만들기 — 5단계</text>

  <g>
    <rect class="b1" x="24" y="70" width="118" height="56" rx="10"/>
    <text x="83" y="86" class="n">①</text><text x="83" y="104" class="t">문제 정의</text>
    <line class="ln" x1="142" y1="98" x2="168" y2="98" marker-end="url(#ah)"/>

    <rect class="b1" x="170" y="70" width="126" height="56" rx="10"/>
    <text x="233" y="86" class="n">②</text><text x="233" y="104" class="t">데이터 수집·라벨링</text>
    <line class="ln" x1="296" y1="98" x2="322" y2="98" marker-end="url(#ah)"/>

    <rect class="b2" x="324" y="70" width="110" height="56" rx="10"/>
    <text x="379" y="86" class="n">③</text><text x="379" y="104" class="t">모델 학습</text>
    <line class="ln" x1="434" y1="98" x2="460" y2="98" marker-end="url(#ah)"/>

    <rect class="b2" x="462" y="70" width="110" height="56" rx="10"/>
    <text x="517" y="86" class="n">④</text><text x="517" y="104" class="t">평가(정확도)</text>
    <line class="ln" x1="572" y1="98" x2="598" y2="98" marker-end="url(#ah)"/>

    <rect class="b3" x="600" y="70" width="96" height="56" rx="10"/>
    <text x="648" y="86" class="n">⑤</text><text x="648" y="104" class="t">활용·개선</text>
  </g>

  <!-- 재학습 피드백 화살표 -->
  <path class="ln" d="M648,126 V158 H233 V128" marker-end="url(#ah)" stroke-dasharray="5 4"/>
  <text x="440" y="176" class="ex">정확도가 낮으면 → 데이터를 더 모아 다시 학습</text>
</svg>
