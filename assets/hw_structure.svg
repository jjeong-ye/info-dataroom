<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4b5563"/>
    </marker>
    <style>
      .t{font-size:14px;fill:#1f2637;text-anchor:middle;dominant-baseline:middle;font-weight:700;}
      .ex{font-size:11px;fill:#6b7280;text-anchor:middle;}
      .head{font-size:15px;font-weight:700;fill:#1f2637;text-anchor:middle;}
      .ln{stroke:#4b5563;stroke-width:1.8;fill:none;}
      .inp{fill:#e6f7f5;stroke:#0ea5a4;stroke-width:1.6;}
      .cpu{fill:#fff4e6;stroke:#f59e0b;stroke-width:1.6;}
      .mem{fill:#f3ecff;stroke:#8b5cf6;stroke-width:1.6;}
      .out{fill:#eef2ff;stroke:#3b6ef5;stroke-width:1.6;}
    </style>
  </defs>
  <text x="360" y="24" class="head">하드웨어의 5대 구성 — 입력 · 처리 · 기억 · 출력 · 통신</text>

  <!-- 입력 -->
  <rect class="inp" x="30" y="96" width="120" height="52" rx="10"/>
  <text x="90" y="116" class="t">입력 장치</text>
  <text x="90" y="134" class="ex">키보드·마우스·센서</text>
  <line class="ln" x1="150" y1="122" x2="205" y2="122" marker-end="url(#ah)"/>

  <!-- 처리 -->
  <rect class="cpu" x="210" y="96" width="130" height="52" rx="10"/>
  <text x="275" y="116" class="t">처리 장치(CPU)</text>
  <text x="275" y="134" class="ex">연산 + 제어</text>
  <line class="ln" x1="340" y1="122" x2="395" y2="122" marker-end="url(#ah)"/>

  <!-- 출력 -->
  <rect class="out" x="400" y="96" width="120" height="52" rx="10"/>
  <text x="460" y="116" class="t">출력 장치</text>
  <text x="460" y="134" class="ex">모니터·스피커</text>

  <!-- 기억(위) 처리와 양방향 -->
  <rect class="mem" x="210" y="30" width="130" height="46" rx="10"/>
  <text x="275" y="48" class="t">기억 장치</text>
  <text x="275" y="65" class="ex">주기억(RAM)·보조기억(SSD)</text>
  <line class="ln" x1="275" y1="76" x2="275" y2="94" marker-end="url(#ah)"/>
  <line class="ln" x1="290" y1="94" x2="290" y2="78" marker-end="url(#ah)"/>

  <!-- 통신(아래) -->
  <rect class="mem" x="210" y="176" width="130" height="46" rx="10" fill="#eafbea" stroke="#4bb96a"/>
  <text x="275" y="194" class="t">통신 장치</text>
  <text x="275" y="211" class="ex">랜카드·와이파이</text>
  <line class="ln" x1="275" y1="148" x2="275" y2="174" marker-end="url(#ah)"/>

  <text x="580" y="122" class="ex">소프트웨어가</text>
  <text x="580" y="140" class="ex">이 장치들을 동작시킴</text>
</svg>
