<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <defs>
    <style>
      .head{font-size:15px;font-weight:700;fill:#1f2637;text-anchor:middle;}
      .sub{font-size:13px;font-weight:700;text-anchor:middle;}
      .ex{font-size:11px;fill:#6b7280;text-anchor:middle;}
      .num{font-size:12px;fill:#1f2637;text-anchor:middle;dominant-baseline:middle;font-weight:700;}
      .cell{fill:#f3f4f6;stroke:#c7d0e0;stroke-width:1.2;}
      .chk{fill:#dbe4ff;stroke:#3b6ef5;stroke-width:1.4;}
      .hit{fill:#c8f2ec;stroke:#0ea5a4;stroke-width:1.8;}
    </style>
  </defs>
  <text x="360" y="26" class="head">탐색 효율 비교 — 순차 탐색 vs 이분 탐색 (7 찾기)</text>

  <!-- 순차 -->
  <text x="360" y="56" class="sub" fill="#3b6ef5">순차 탐색 — 하나씩 확인</text>
  <g>
    <rect class="chk" x="60" y="70" width="44" height="40" rx="6"/><text x="82" y="90" class="num">1</text>
    <rect class="chk" x="110" y="70" width="44" height="40" rx="6"/><text x="132" y="90" class="num">3</text>
    <rect class="chk" x="160" y="70" width="44" height="40" rx="6"/><text x="182" y="90" class="num">4</text>
    <rect class="chk" x="210" y="70" width="44" height="40" rx="6"/><text x="232" y="90" class="num">6</text>
    <rect class="hit" x="260" y="70" width="44" height="40" rx="6"/><text x="282" y="90" class="num">7</text>
    <rect class="cell" x="310" y="70" width="44" height="40" rx="6"/><text x="332" y="90" class="num">9</text>
    <rect class="cell" x="360" y="70" width="44" height="40" rx="6"/><text x="382" y="90" class="num">11</text>
  </g>
  <text x="500" y="94" class="ex">앞에서부터 5번 확인 → 발견</text>

  <!-- 이분 -->
  <text x="360" y="150" class="sub" fill="#0ea5a4">이분 탐색 — 반씩 좁히기(정렬됨)</text>
  <g>
    <rect class="cell" x="60" y="164" width="44" height="40" rx="6"/><text x="82" y="184" class="num">1</text>
    <rect class="cell" x="110" y="164" width="44" height="40" rx="6"/><text x="132" y="184" class="num">3</text>
    <rect class="cell" x="160" y="164" width="44" height="40" rx="6"/><text x="182" y="184" class="num">4</text>
    <rect class="chk" x="210" y="164" width="44" height="40" rx="6"/><text x="232" y="184" class="num">6</text>
    <rect class="hit" x="260" y="164" width="44" height="40" rx="6"/><text x="282" y="184" class="num">7</text>
    <rect class="chk" x="310" y="164" width="44" height="40" rx="6"/><text x="332" y="184" class="num">9</text>
    <rect class="cell" x="360" y="164" width="44" height="40" rx="6"/><text x="382" y="184" class="num">11</text>
  </g>
  <text x="232" y="220" class="ex">가운데(6)</text>
  <text x="520" y="188" class="ex">가운데부터 반씩 → 2~3번이면 발견</text>

  <text x="360" y="242" class="ex">데이터가 많아질수록(30개: 순차 최대 30번 vs 이분 약 5번) 차이가 커진다</text>
</svg>
